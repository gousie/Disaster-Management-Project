spring.application.name=Disaster_Management
server.port=${PORT:8081}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/disaster}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File Uploads
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===== Cross-device media (REQUIRED for other PCs / phones) =====
# Use your computer's LAN IP when testing on phone/other PC (same Wi‑Fi).
# Windows: ipconfig  →  IPv4 Address
# Mac/Linux: ifconfig or ip a
# Example: http://192.168.1.10:8081
# On production, set to your public API URL, e.g. https://api.yourdomain.com
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.upload-dir=uploads

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Sender
app.mail.from=${MAIL_USERNAME}
app.mail.from-name=DISASTRA Funds
